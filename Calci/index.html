<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Calculator</h2>
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button class="clear" onclick="clearOne()">DEL</button>
        <button class="operator" onclick="expression('%')">%</button>
        <button class="operator" onclick="expression('/')">/</button>
        <button onclick="expression(7)">7</button>
        <button onclick="expression(8)">8</button>
        <button onclick="expression(9)">9</button>
        <button class="operator" onclick="expression('*')">*</button>
        <button onclick="expression(4)">4</button>
        <button onclick="expression(5)">5</button>
        <button onclick="expression(6)">6</button>
        <button class="operator" onclick="expression('-')">-</button>
        <button onclick="expression(1)">1</button>
        <button onclick="expression(2)">2</button>
        <button onclick="expression(3)">3</button>
        <button class="operator" onclick="expression('+')">+</button>
        <button onclick="expression(0)">0</button>
        <button onclick="expression('.')">.</button>
        <button class="equal" onclick="result()">=</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
